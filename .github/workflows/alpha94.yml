name: Alpha94 root validation
on:
  push:
    branches: [alpha94-consolidation]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alpha94-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: .
    shell: pwsh
jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Pin npm and install locked dependencies
        run: |
          npm install --global npm@11.11.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --ignore-scripts
      - name: Install checksum-pinned Python 3.12.14
        run: |
          $pythonRoot = Join-Path $env:RUNNER_TEMP 'alpha94-python'
          New-Item -ItemType Directory -Path $pythonRoot -Force | Out-Null
          $archive = Join-Path $pythonRoot 'cpython.tar.gz'
          Invoke-WebRequest -Uri 'https://github.com/astral-sh/python-build-standalone/releases/download/20260901/cpython-3.12.14%2B20260901-x86_64-pc-windows-msvc-install_only.tar.gz' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'e90c1b6419da3bd812dd73bb3de40287a21abf153438147639ec5e20375ea93f') { throw 'Python archive checksum mismatch' }
          tar -xzf $archive -C $pythonRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pythonExe = Join-Path $pythonRoot 'python/python.exe'
          & $pythonExe -c "import sys; assert sys.version_info[:3] == (3, 12, 14)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ALPHA94_BASE_PYTHON=$pythonExe" >> $env:GITHUB_ENV
      - name: Isolated Python validation environment
        run: |
          & $env:ALPHA94_BASE_PYTHON -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip install --require-hashes --only-binary=:all: -r requirements-validation.lock
      - name: Install pinned Chromium
        run: npx playwright install chromium
      - name: Static, syntax, JSON and HTML
        run: npm run test:static
      - name: Catalogue and data regressions
        run: npm run test:catalogue
      - name: Domain and dependencies
        run: npm run test:domain
      - name: Visual runtime and frozen GLB integrity
        run: npm run test:visual
      - name: Projects, persistence and quote adversarial gates
        run: npm run test:persistence
      - name: Visual governance and reviewers
        run: npm run test:governance
      - name: Current WF5 acceptance and promotion assertions
        run: npm run test:wf5
      - name: Chromium desktop smoke journeys
        run: npm run test:browser
      - name: Python candidate and reconstruction evidence
        run: npm run test:python
      - name: Preserve validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha94-validation-${{ github.run_id }}
          path: .validation/results/
          if-no-files-found: warn
